<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-C3 蓝牙串口调试器</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --fg:#d7dae0; --dim:#8b93a1;
          --accent:#4ea1ff; --ok:#3ddc84; --warn:#ffb020; --err:#ff5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Consolas","Cascadia Mono",Menlo,monospace; font-size:14px; }
  header { padding:12px 16px; background:var(--panel);
           border-bottom:1px solid #262a33; display:flex; flex-wrap:wrap;
           gap:10px; align-items:center; }
  h1 { font-size:15px; margin:0 14px 0 0; font-weight:600; }
  button { background:#222832; color:var(--fg); border:1px solid #333b48;
           border-radius:6px; padding:6px 12px; cursor:pointer; font-family:inherit;
           font-size:13px; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent); color:#04101f; border-color:var(--accent);
                   font-weight:600; }
  select, input[type=text] { background:#0c0e13; color:var(--fg);
           border:1px solid #333b48; border-radius:6px; padding:6px 8px;
           font-family:inherit; font-size:13px; }
  .status { font-size:13px; color:var(--dim); margin-left:auto; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
         background:#555; margin-right:6px; vertical-align:middle; }
  .dot.on { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
         padding:10px 16px; background:var(--panel);
         border-bottom:1px solid #262a33; }
  label { color:var(--dim); font-size:13px; display:flex; align-items:center; gap:5px; }
  #term { margin:0; padding:12px 16px; height:calc(100vh - 232px);
          overflow:auto; white-space:pre-wrap; word-break:break-all;
          line-height:1.45; background:#0b0d11; }
  #term .ts   { color:var(--dim); }
  #term .rx   { color:var(--fg); }
  #term .sys  { color:var(--warn); }
  #term .sent { color:var(--accent); }
  #term .err  { color:var(--err); }
  footer { display:flex; gap:8px; padding:10px 16px; background:var(--panel);
           border-top:1px solid #262a33; }
  footer input[type=text] { flex:1; }
  .hint { color:var(--dim); font-size:12px; padding:6px 16px 0; }
  .hint.err { color:var(--err); }
  #uvinfo { padding:6px 16px 0; color:var(--dim); font-size:12px; }
  #uvinfo b { color:var(--ok); font-weight:600; }
  #uvinfo .kv { color:var(--fg); }
</style>
</head>
<body>

<header>
  <h1>ESP32-C3 串口调试器</h1>
  <button id="btnConnect" class="primary">连接</button>
  <button id="btnDisconnect" disabled>断开</button>
  <span class="status"><span class="dot" id="dot"></span><span id="status">未连接</span></span>
</header>

<div class="bar">
  <label>波特率
    <select id="baud">
      <option>9600</option><option>19200</option><option>38400</option>
      <option>57600</option><option selected>115200</option><option>230400</option>
      <option>460800</option><option>921600</option><option>1500000</option>
    </select>
  </label>
  <button id="btnBaud" disabled>应用</button>
  <button id="btnStatus" disabled>读取状态</button>
  <button id="btnFlush" disabled>清空缓冲</button>
  <button id="btnSelftest" disabled>自检</button>
  <button id="btnUvk6" disabled>查询UVK6设备信息</button>
  <span style="flex:1"></span>
  <label><input type="checkbox" id="hexView"> HEX 显示</label>
  <label><input type="checkbox" id="autoScroll" checked> 自动滚动</label>
  <label><input type="checkbox" id="localEcho" checked> 本地回显</label>
  <button id="btnClear">清屏</button>
</div>

<div class="hint" id="hint">提示：Web Bluetooth 需要安全上下文，请用
  <b>https</b> 或 <b>http://localhost</b> 打开本页；且需 Chrome / Edge 浏览器。</div>

<pre id="term"></pre>

<footer>
  <input type="text" id="input" placeholder="输入要发送到被测设备的内容，回车发送" disabled>
  <label><input type="checkbox" id="hexSend"> HEX 发送</label>
  <label><input type="checkbox" id="addCRLF" checked> 追加 CRLF</label>
  <button id="btnSend" class="primary" disabled>发送</button>
</footer>
<div class="hint" id="sendHint"></div>
<div id="uvinfo"></div>

<script>
"use strict";

/* NUS UUID（与固件 ble_uart 组件一致） */
const SVC = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // 网页 -> 设备（写）
const TX  = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // 设备 -> 网页（通知）

/* 控制帧魔术前缀 "ESC B L" */
const MAGIC = [0x1B, 0x42, 0x4C];
const CHUNK = 20;   // 发送分片，兼容最小 MTU

const $ = id => document.getElementById(id);
const term = $("term");
const sleep = ms => new Promise(r => setTimeout(r, ms));

let device, server, rxChar, txChar;
let decoder = new TextDecoder("utf-8");
let hexMode = false;

/* ---------------- 终端输出（带时间戳，按行） ---------------- */
function scroll() {
  if ($("autoScroll").checked) term.scrollTop = term.scrollHeight;
}
function appendNode(node) { term.appendChild(node); scroll(); }

/* [HH:MM:SS] */
function ts() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return "[" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "]";
}

/* 输出一行：dir 为方向标记，如 "<<"(收) / ">>"(发) / "[设备]" / "[错误]" */
function addLine(dir, text, cls) {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  const t = document.createElement("span");
  t.className = "ts";
  t.textContent = ts() + " ";
  span.appendChild(t);
  span.appendChild(document.createTextNode(dir + " " + text + "\n"));
  appendNode(span);
}

function addSystem(s) {
  flushRx();
  addLine("[设备]", s, "sys");
}
function addSent(s) {
  if (!$("localEcho").checked) return;
  /* 去掉正文结尾自带的换行，统一按一行显示 */
  addLine(">>", s.replace(/[\r\n]+$/, ""), "sent");
}
function addError(s) {
  flushRx();
  addLine("[错误]", s, "err");
}

/* ================================================================== */
/* UV-K6（罗师虎 LOSEHU 固件）串口协议：查询设备信息                     */
/*                                                                    */
/* 帧格式:  AB CD | Size(2B,小端) | Payload(Size) | CRC16(2B,小端) | DC BA
/* 应答:    AB CD | Size(2B,小端) | 内层报文(Size) | 填充(2B) | DC BA      */
/*   - Payload = [命令ID(2B,小端)][数据...]                             */
/*   - CRC16-CCITT/XMODEM（poly 0x1021，初值 0），仅覆盖 Payload         */
/*   - 查询命令 0x0514（数据为 4 字节时间戳/会话ID）                     */
/*   - 应答 0x0515 = 版本字符串(16B) + 自定义AES(1B) + 锁屏(1B) + ...    */
/* ================================================================== */

const UVK6_BAUD = "38400";      // UV-K5/K6 标准波特率

function crc16xmodem(bytes) {
  let crc = 0;
  for (let i = 0; i < bytes.length; i++) {
    crc ^= (bytes[i] << 8) & 0xffff;
    for (let b = 0; b < 8; b++) {
      crc = (crc & 0x8000) ? (((crc << 1) ^ 0x1021) & 0xffff) : ((crc << 1) & 0xffff);
    }
  }
  return crc & 0xffff;
}

/* 组帧：cmdId 为命令 ID，data 为数据字节数组 */
function buildUvk6Frame(cmdId, data) {
  const payload = new Uint8Array(2 + data.length);
  payload[0] = cmdId & 0xff;
  payload[1] = (cmdId >> 8) & 0xff;
  payload.set(data, 2);

  const crc = crc16xmodem(payload);
  const frame = new Uint8Array(2 + 2 + payload.length + 2 + 2);
  frame[0] = 0xAB;
  frame[1] = 0xCD;
  frame[2] = payload.length & 0xff;
  frame[3] = (payload.length >> 8) & 0xff;
  frame.set(payload, 4);
  frame[4 + payload.length] = crc & 0xff;
  frame[5 + payload.length] = (crc >> 8) & 0xff;
  frame[6 + payload.length] = 0xDC;
  frame[7 + payload.length] = 0xBA;
  return frame;
}

/* ---------------- 应答解析状态机（逐字节喂入，可跨 BLE 分片） ---------------- */
let uvState = 0;        // 0找AB 1找CD 2/3读长度 4收Payload 5/6填充 7找DC 8找BA
let uvSize = 0;
let uvBuf = [];
let uvWaitTimer = null;
let uvGot = false;      // 本轮查询是否收到过应答

function uvk6Reset() {
  uvState = 0;
  uvSize = 0;
  uvBuf = [];
  uvGot = false;
  if (uvWaitTimer) { clearTimeout(uvWaitTimer); uvWaitTimer = null; }
}

function uvk6Push(b) {
  switch (uvState) {
    case 0: if (b === 0xAB) uvState = 1; break;
    case 1: uvState = (b === 0xCD) ? 2 : (b === 0xAB ? 1 : 0); break;
    case 2: uvSize = b; uvState = 3; break;
    case 3:
      uvSize |= b << 8;
      uvBuf = [];
      uvState = (uvSize > 0 && uvSize <= 250) ? 4 : 0;
      break;
    case 4:
      uvBuf.push(b);
      if (uvBuf.length >= uvSize) uvState = 5;
      break;
    case 5: uvState = 6; break;                       // 填充字节 1
    case 6: uvState = 7; break;                       // 填充字节 2
    case 7: uvState = (b === 0xDC) ? 8 : 0; break;    // 结尾标记 DC BA
    case 8: if (b === 0xBA) uvk6HandleReply(uvBuf); uvState = 0; break;
  }
}

/* 版本后缀 -> EEPROM 容量要求（罗师虎固件命名约定） */
function uvk6EepromHint(ver) {
  if (/(HS|H)$/.test(ver)) return "≥2 Mib（中文输入法/开机图片）";
  if (/(EK|K)$/.test(ver)) return "≥1 Mib（多普勒/开机图片）";
  return "无需扩容";
}

function uvk6HandleReply(buf) {
  if (uvWaitTimer) { clearTimeout(uvWaitTimer); uvWaitTimer = null; }
  if (buf.length < 4) return;
  const innerId = buf[0] | (buf[1] << 8);

  if (innerId !== 0x0515) {
    addSystem("收到未预期的应答 ID 0x" + innerId.toString(16).padStart(4, "0"));
    return;
  }

  uvGot = true;
  let ver = "";
  for (let i = 0; i < 16 && (4 + i) < buf.length; i++) {
    const c = buf[4 + i];
    if (!c) break;
    ver += String.fromCharCode(c);
  }
  const hasAes = buf.length > 20 ? !!(buf[20] & 0xff) : false;
  const locked = buf.length > 21 ? !!(buf[21] & 0xff) : false;

  addSystem("设备信息 0x0515: 固件版本 = " + (ver || "?") +
            " | 自定义AES密钥 = " + (hasAes ? "是" : "否") +
            " | 锁屏 = " + (locked ? "是" : "否"));
  addSystem("EEPROM 需求: " + uvk6EepromHint(ver));

  $("uvinfo").innerHTML =
    "固件信息：版本 <b>" + (ver || "?") + "</b>" +
    " ｜ EEPROM <span class=\"kv\">" + uvk6EepromHint(ver) + "</span>" +
    " ｜ 密钥 <span class=\"kv\">" + (hasAes ? "已设置" : "默认") + "</span>" +
    " ｜ 状态 <span class=\"kv\">" + (locked ? "锁屏" : "正常") + "</span>";
}

/* 一键查询：切 38400 -> 清缓冲 -> 发 0x0514 -> 等 0x0515 */
async function queryUvk6() {
  if (!rxChar) { addError("未连接"); return; }
  try {
    /* 1) 自动切到 38400（UV-K6 标准波特率） */
    $("baud").value = UVK6_BAUD;
    await sendControl("BAUD=" + UVK6_BAUD);
    await sleep(200);

    /* 2) 清掉链路上的残留数据，避免旧字节污染解析 */
    await sendControl("FLUSH");
    await sleep(120);

    /* 3) 组帧并发送 0x0514（4 字节会话时间戳） */
    uvk6Reset();
    const ts = Date.now() >>> 0;
    const data = new Uint8Array([ts & 0xff, (ts >>> 8) & 0xff, (ts >>> 16) & 0xff, (ts >>> 24) & 0xff]);
    const frame = buildUvk6Frame(0x0514, data);
    addLine(">>", "UV-K6 查询设备信息: " + toHexString(frame), "sent");
    await sendBytes(frame);

    /* 4) 超时提示 */
    uvWaitTimer = setTimeout(() => {
      uvWaitTimer = null;
      if (!uvGot) {
        addSystem("未收到 0x0515 应答：请确认 UV-K6 已开机、写频线接在串口上，且固件为罗师虎(LOSEHU)版本。");
      }
    }, 1500);
  } catch (err) {
    addError(err.message || String(err));
  }
}

/* ---------------- 接收：字节流解析（可跨通知分片） ---------------- */
let state = 0;          // 0=普通 1=ESC 2=ESC+B 3=控制帧内
let ctlBuf = "";

function feed(b) {
  switch (state) {
    case 0:
      if (b === MAGIC[0]) state = 1; else pushData(b);
      break;
    case 1:
      if (b === MAGIC[1]) state = 2;
      else { pushData(MAGIC[0]); if (b === MAGIC[0]) state = 1; else { state = 0; pushData(b); } }
      break;
    case 2:
      if (b === MAGIC[2]) { state = 3; ctlBuf = ""; }
      else {
        pushData(MAGIC[0]); pushData(MAGIC[1]);
        if (b === MAGIC[0]) state = 1; else { state = 0; pushData(b); }
      }
      break;
    case 3:
      if (b === 0x0A) { addSystem(ctlBuf); state = 0; }
      else ctlBuf += String.fromCharCode(b);
      break;
  }
}

/* ---------------- 接收：按行缓冲后带时间戳输出 ---------------- */
let rxLine = "";   // 文本模式下未凑满一行的接收缓冲
let hexLine = "";  // HEX 模式下本轮通知累计的字节
let rxTimer = null;

function flushRx() {
  if (rxTimer) { clearTimeout(rxTimer); rxTimer = null; }
  if (rxLine) { addLine("<<", rxLine, "rx"); rxLine = ""; }
}

/* 若一段时间内没有新数据（对端没发换行），把残留内容也作为一行输出 */
function scheduleFlush() {
  if (rxTimer) clearTimeout(rxTimer);
  rxTimer = setTimeout(() => { rxTimer = null; flushRx(); }, 80);
}

function pushData(b) {
  if (hexMode) {
    hexLine += b.toString(16).padStart(2, "0") + " ";
    return;
  }
  rxLine += decoder.decode(Uint8Array.of(b), { stream: true });
  let i;
  while ((i = rxLine.search(/[\r\n]/)) >= 0) {
    const line = rxLine.slice(0, i);
    rxLine = (rxLine[i] === "\r" && rxLine[i + 1] === "\n")
      ? rxLine.slice(i + 2) : rxLine.slice(i + 1);
    addLine("<<", line, "rx");
  }
  if (rxLine) scheduleFlush();
}

function onData(e) {
  const dv = e.target.value;
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
  for (const b of bytes) {
    uvk6Push(b);   // 原始字节先喂给 UV-K6 协议解析（独立于显示模式）
    feed(b);       // 再交给终端显示/控制帧解析
  }
  if (hexMode && hexLine) { addLine("<<", hexLine.trim(), "rx"); hexLine = ""; }
}

/* ---------------- 连接 / 断开 ---------------- */
async function connect() {
  try {
    if (!navigator.bluetooth) throw new Error("当前浏览器不支持 Web Bluetooth");
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC] }],
    });
    device.addEventListener("gattserverdisconnected", onDisconnected);

    server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    rxChar = await svc.getCharacteristic(RX);
    txChar = await svc.getCharacteristic(TX);

    await txChar.startNotifications();
    txChar.addEventListener("characteristicvaluechanged", onData);

    setConnected(true, device.name || "(未命名)");
    addSystem("已连接 " + (device.name || "") + "，正在查询状态…");
    uvk6Reset();
    await sendControl("STATUS");
  } catch (err) {
    if (err && err.name === "NotFoundError") return; // 用户取消选择
    addError(err.message || String(err));
  }
}

function onDisconnected() {
  setConnected(false, "已断开");
  addSystem("连接已断开");
  uvk6Reset();
}

async function disconnect() {
  try { if (txChar) await txChar.stopNotifications(); } catch (_) {}
  try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (_) {}
  setConnected(false, "未连接");
  uvk6Reset();
}

function setConnected(on, text) {
  $("status").textContent = text;
  $("dot").classList.toggle("on", on);
  $("btnConnect").disabled = on;
  $("btnDisconnect").disabled = !on;
  ["btnBaud", "btnStatus", "btnFlush", "btnSelftest", "btnUvk6", "btnSend", "input"].forEach(id => { $(id).disabled = !on; });
}

/* ---------------- 发送 ---------------- */
async function sendBytes(bytes) {
  if (!rxChar) throw new Error("未连接");
  for (let i = 0; i < bytes.length; i += CHUNK) {
    await rxChar.writeValueWithoutResponse(bytes.slice(i, i + CHUNK));
  }
}

/* 解析 HEX 字符串为字节数组，允许空格/逗号/分号/冒号/横线分隔以及 0x 前缀 */
function parseHex(str) {
  const cleaned = str.replace(/0x/gi, "").replace(/[\s,;:_-]/g, "");
  if (!cleaned) return null;
  const bad = cleaned.match(/[^0-9a-fA-F]/);
  if (bad) throw new Error("HEX 含非法字符 “" + bad[0] + "”，仅支持 0-9 / A-F");
  if (cleaned.length % 2 !== 0)
    throw new Error("HEX 字符数必须为偶数（当前 " + cleaned.length + " 个）");
  const out = new Uint8Array(cleaned.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(cleaned.substr(i * 2, 2), 16);
  return out;
}

function toHexString(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join(" ");
}

async function sendText() {
  const raw = $("input").value;
  if (!raw) return;
  let bytes, echo;
  if ($("hexSend").checked) {
    try {
      bytes = parseHex(raw);
    } catch (err) {
      addError(err.message || String(err));
      return;
    }
    if (!bytes || !bytes.length) return;
    echo = toHexString(bytes);
  } else {
    const text = $("addCRLF").checked ? raw + "\r\n" : raw;
    bytes = new TextEncoder().encode(text);
    echo = text;
  }
  /* 先回显再发送：保证本地回显显示在设备响应之前 */
  addSent(echo);
  $("input").value = "";
  try {
    await sendBytes(bytes);
  } catch (err) {
    addError(err.message || String(err));
  }
}

async function sendControl(cmd) {
  const body = new TextEncoder().encode(cmd);
  const frame = new Uint8Array(MAGIC.length + body.length);
  frame.set(MAGIC, 0);
  frame.set(body, MAGIC.length);
  await sendBytes(frame);
}

/* ---------------- 事件绑定 ---------------- */
$("btnConnect").onclick = connect;
$("btnDisconnect").onclick = disconnect;
$("btnSend").onclick = sendText;
$("input").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); sendText(); } });

$("btnBaud").onclick = async () => {
  try { await sendControl("BAUD=" + $("baud").value); }
  catch (err) { addError(err.message || String(err)); }
};
$("btnStatus").onclick = async () => {
  try { await sendControl("STATUS"); } catch (err) { addError(err.message || String(err)); }
};
$("btnFlush").onclick = async () => {
  try { await sendControl("FLUSH"); } catch (err) { addError(err.message || String(err)); }
};
$("btnSelftest").onclick = async () => {
  try { await sendControl("SELFTEST"); } catch (err) { addError(err.message || String(err)); }
};
$("btnUvk6").onclick = queryUvk6;
$("btnClear").onclick = () => {
  term.textContent = "";
  decoder = new TextDecoder("utf-8");
  rxLine = ""; hexLine = "";
  uvk6Reset();
};

$("hexView").onchange = e => {
  hexMode = e.target.checked;
  term.textContent = "";
  decoder = new TextDecoder("utf-8");
  rxLine = ""; hexLine = "";
  uvk6Reset();
  addSystem(hexMode ? "已切换为 HEX 显示" : "已切换为文本显示");
};

/* 发送模式切换：HEX 发送时忽略 CRLF 追加，直接发送解析出的原始字节 */
function applySendMode() {
  const hex = $("hexSend").checked;
  $("addCRLF").disabled = hex;
  $("input").placeholder = hex
    ? "输入 HEX 字节，如 01 02 0A 或 01020A，回车发送"
    : "输入要发送到被测设备的内容，回车发送";
  $("sendHint").textContent = hex
    ? "HEX 发送：支持空格/逗号等分隔符与 0x 前缀，例如 “0x01 0x02 FF”；将按原始字节发送，不追加 CRLF。"
    : "";
}
$("hexSend").onchange = applySendMode;
applySendMode();

/* 环境检查 */
if (!window.isSecureContext) {
  $("hint").classList.add("err");
  $("hint").textContent = "当前不是安全上下文（https / localhost），Web Bluetooth 将不可用。";
}
</script>
</body>
</html>
